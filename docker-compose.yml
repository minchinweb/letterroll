services:
  web:
    build: .
    container_name: letterroll-web
    restart: unless-stopped
    env_file: .env
    command: ["gunicorn", "letterroll_project.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--access-logfile", "-", "--error-logfile", "-"]
    volumes:
      - ./data:/data
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    container_name: letterroll-worker
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "runworker"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./data:/data
